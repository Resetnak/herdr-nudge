# Throwaway capture plugin. Link with: herdr plugin link tools/probe
# Unlink with:                herdr plugin unlink probe
id = "probe"
name = "probe"
version = "0.0.1"
min_herdr_version = "0.9.0"
platforms = ["macos"]

[[events]]
on = "workspace.created"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "workspace.updated"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "workspace.renamed"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "workspace.moved"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "workspace.reordered"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "workspace.focused"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "workspace.closed"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "worktree.created"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "worktree.opened"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "tab.created"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "tab.closed"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "tab.renamed"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "tab.moved"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "tab.focused"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "pane.created"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "pane.closed"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "pane.focused"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "pane.moved"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "pane.exited"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "pane.agent_detected"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]

[[events]]
on = "pane.agent_status_changed"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/dump.sh\""]
